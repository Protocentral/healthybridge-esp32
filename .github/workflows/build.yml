name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESP-IDF build + merge-bin (esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32c3
          path: '.'
          command: idf.py build && idf.py merge-bin -o healthybridge-esp32-merged.bin

      - name: Collect distributables
        run: |
          mkdir -p dist
          cp build/healthybridge-esp32-merged.bin       dist/
          cp build/healthybridge_esp32c3.bin            dist/healthybridge-esp32-app.bin
          cp build/bootloader/bootloader.bin            dist/
          cp build/partition_table/partition-table.bin  dist/
          cp flash.sh flash.bat                         dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthybridge-esp32-firmware
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Flashing

            Download `healthybridge-esp32-merged.bin` plus
            `flash.sh` (or `flash.bat`), `pip install esptool`, then:

            ```
            ./flash.sh <PORT>               # full install (erases stored Wi-Fi/settings)
            ./flash.sh <PORT> --app-only    # update app only, keeps settings
            ```
