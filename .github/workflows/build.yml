name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESP-IDF build (esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32c3
          path: '.'

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/hb_lite_esp32c3.bin artifacts/ 2>/dev/null || true
          cp build/bootloader/bootloader.bin artifacts/ 2>/dev/null || true
          cp build/partition_table/partition-table.bin artifacts/ 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: healthypi5_next_esp32-firmware
          path: artifacts/
