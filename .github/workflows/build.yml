name: build

on:
  push:
    branches: [main]
    # Two products, two tag series, so a tag can only ever publish one of them:
    #   v1.2.3      HealthyPi 5 (ESP32-C3) release -- the series v1.0.0 started
    #   hp6-v1.2.3  HealthyPi 6 (ESP32-C6) release
    tags: ['v*', 'hp6-v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Host-side unit tests: codec + frozen HealthyPi 5 layouts, OpenView packer,
  # HealthyPi 6 vitals and firmware-update receiver, page substituter. Plain C,
  # no ESP-IDF; same script contributors run.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host tests
        run: CC=gcc test/run_host_tests.sh

  # HealthyPi 5 profile (ESP32-C3). Publishes a release for v* tags only.
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ESP-IDF build + merge-bin (esp32c3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32c3
          path: '.'
          command: idf.py build && idf.py merge-bin -o healthybridge-esp32-merged.bin

      - name: Collect distributables
        run: |
          mkdir -p dist
          cp build/healthybridge-esp32-merged.bin       dist/
          cp build/healthybridge_esp32c3.bin            dist/healthybridge-esp32-app.bin
          cp build/bootloader/bootloader.bin            dist/
          cp build/partition_table/partition-table.bin  dist/
          cp flash.sh flash.bat                         dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthybridge-esp32-firmware
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Flashing

            Download `healthybridge-esp32-merged.bin` plus
            `flash.sh` (or `flash.bat`), `pip install esptool`, then:

            ```
            ./flash.sh <PORT>               # full install (erases stored Wi-Fi/settings)
            ./flash.sh <PORT> --app-only    # update app only, keeps settings
            ```

  # HealthyPi 6 profile (ESP32-C6). Publishes a release for hp6-v* tags only;
  # the healthypi-6-fw release workflow builds its own copy from that tag. Driven through
  # hp6.sh so CI exercises the same script contributors run locally (own build
  # dir + sdkconfig, seeded from sdkconfig.defaults + sdkconfig.hp6.defaults).
  firmware-hp6:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The HealthyPi 6 image ships built with ESP-IDF 6.1.1 (healthypi-6-fw
      # release decision, 2026-11-20); build CI with the same, so the artifact
      # is what ships. The HP5 job above stays on 6.0.1.
      - name: ESP-IDF build + merge-bin (esp32c6, HP6 profile)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1.1
          target: esp32c6
          path: '.'
          command: bash hp6.sh merge

      # Each OTA slot is 1984 KB (partitions.hp6.csv) and an update has to fit
      # the inactive one. Fail above 85% so the image cannot creep up to the
      # slot edge unnoticed; at -Os it is ~70% today.
      - name: Check app image size against the OTA slot
        run: python3 tools/check_app_size.py build.hp6 0.85

      # flash_hp6.sh reads offsets from build.hp6/flasher_args.json, so ship the
      # outputs in that layout: unpack the artifact and run ./flash_hp6.sh there.
      - name: Collect distributables
        run: |
          d=dist-hp6/build.hp6
          mkdir -p "$d/bootloader" "$d/partition_table"
          cp build.hp6/flasher_args.json build.hp6/flash_args \
             build.hp6/ota_data_initial.bin build.hp6/healthybridge_esp32c6.bin \
             build.hp6/healthybridge-hp6-merged.bin               "$d/"
          cp build.hp6/bootloader/bootloader.bin                  "$d/bootloader/"
          cp build.hp6/partition_table/partition-table.bin        "$d/partition_table/"
          cp flash_hp6.sh                                         dist-hp6/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: healthybridge-hp6-esp32c6-firmware
          path: dist-hp6/

      # The tag names the version the image reports; refuse a mismatch rather
      # than publish hp6-v1.3.0 carrying a 1.2.0 image.
      - name: Check the tag matches version.txt
        if: startsWith(github.ref, 'refs/tags/hp6-v')
        run: |
          want="${GITHUB_REF_NAME#hp6-v}"
          have="$(tr -d '[:space:]' < version.txt)"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but version.txt is $have"; exit 1; }

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/hp6-v')
        run: |
          v="${GITHUB_REF_NAME#hp6-v}"
          (cd dist-hp6 && zip -r "../healthybridge-hp6-esp32c6-$v.zip" .)
          cp build.hp6/healthybridge-hp6-merged.bin "healthybridge-hp6-esp32c6-$v-merged.bin"
          cp build.hp6/healthybridge_esp32c6.bin    "healthybridge-hp6-esp32c6-$v-app.bin"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/hp6-v')
        uses: softprops/action-gh-release@v2
        with:
          name: HealthyBridge ${{ github.ref_name }} (HealthyPi 6, ESP32-C6)
          # The README sends HealthyPi 5 users to releases/latest. An HP6
          # release must never become "latest", or that link serves them a C6
          # image.
          make_latest: false
          files: |
            healthybridge-hp6-esp32c6-*.zip
            healthybridge-hp6-esp32c6-*.bin
          body: |
            HealthyBridge for **HealthyPi 6** (ESP32-C6), built with ESP-IDF 6.1.1.
            Not for HealthyPi 5: its releases are the plain `v*` tags.

            End users update the C6 with the HealthyPi 6 firmware bundle
            (`healthypi fw update`), which carries a signed copy of this image.
            For a full install over the C6's USB port, unpack the zip and run
            `./flash_hp6.sh <PORT>`.
